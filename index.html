<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fff2f5">

<title>Word Match 单词消消乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff2f5;font-family:'Microsoft YaHei','PingFang SC',sans-serif;
  display:flex;justify-content:center;align-items:center;min-height:100dvh;
  overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{width:100%;max-width:420px;height:100dvh;display:flex;flex-direction:column;background:#fff5f7}
/* === Top bar: two-line compact === */
#topbar{padding:6px 12px 4px;background:#fff;border-bottom:1px solid #ffe8ec;flex-shrink:0}
#topbar .t1{display:flex;justify-content:space-between;align-items:center}
#topbar .t1 span{font-size:12px;color:#503737}
#topbar .t1 .pl{color:#c8b8b8;font-size:10px}
#topbar .t2{text-align:center;font-size:16px;font-weight:bold;padding:2px 0}
/* === Panel === */
#panel{margin:6px 10px;padding:8px 12px;background:#fff;border-radius:14px;
  box-shadow:0 1px 6px rgba(200,180,180,.12);text-align:center;flex-shrink:0;min-height:50px}
#panel .mem-label{font-size:12px;color:#e86060}
#panel .words{font-size:13px;color:#e8963c;font-weight:bold;word-break:break-all;line-height:1.3}
#panel .play-label{font-size:12px;color:#968888}
#panel .cn-hint{font-size:13px;color:#e8963c;margin-top:1px}
#panel .progress{font-size:10px;color:#b4a0a0;margin-top:1px}
/* === Canvas: fills space === */
#canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:3px;min-height:0}
canvas{display:block;touch-action:manipulation}
/* === Bottom: compact card === */
#bottom{padding:6px 10px 8px;background:#fff;border-top:1px solid #ffe8ec;flex-shrink:0}
#selected{font-size:17px;color:#e8b832;font-weight:bold;text-align:center;min-height:22px}
#itemRow{display:flex;justify-content:center;gap:5px;padding:4px 0}
#itemRow button{padding:2px 7px;border-radius:8px;font-size:10px;border:1px solid #e8d5d5;
  background:#fff;color:#503737;cursor:pointer}
#itemRow button.empty{background:#f8f8f8;color:#d8d0d0;border-style:dashed}
#itemRow button.shop{background:#fff8f0;color:#c8b8b8;border:1px dashed #e8d5d5;font-size:9px}
#ctrlRow{display:flex;align-items:center;justify-content:center;gap:8px;padding:2px 0}
#ctrlRow button{padding:6px 20px;border:none;border-radius:18px;font-size:14px;font-weight:bold;
  cursor:pointer;background:#ffb48c;color:#fff;box-shadow:0 2px 4px rgba(200,160,140,.3)}
#ctrlRow button:active{transform:scale(.95);background:#ff9660}
#hints{font-size:9px;color:#d0c8c8;text-align:center;padding-top:2px}
/* === Overlays === */
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;
  align-items:center;justify-content:center;z-index:10}
.overlay .card{background:#fff;border-radius:24px;padding:22px 16px;max-width:360px;
  width:92%;text-align:center;box-shadow:0 4px 24px rgba(180,150,150,.25)}
.overlay h2{font-size:22px;color:#503737;margin-bottom:12px}
.overlay p{font-size:14px;color:#968888;margin:6px 0;line-height:1.5}
.overlay .big{font-size:32px;color:#e8963c;font-weight:bold;margin:8px 0}
.overlay button{margin:8px 4px;padding:10px 22px;border:none;border-radius:20px;
  font-size:14px;font-weight:bold;cursor:pointer;background:#ffb48c;color:#fff}
.overlay button:active{background:#ff9660}
.overlay button.secondary{background:#e8d5d5;color:#786868}
.hidden{display:none!important}
#pauseOverlay{background:rgba(255,240,245,.9)}
.stars{font-size:28px;letter-spacing:4px;line-height:1.2}
.star-gold{color:#f0b830}.star-empty{color:#e0d8d0}
.unlock-pop{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#fff7e0,#fff);
  border:2px solid #f0b830;border-radius:16px;padding:14px 22px;box-shadow:0 4px 20px rgba(200,160,50,.3);
  z-index:101;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="t1">
      <span><span class="pl" id="playerTag"></span> <span id="levelInfo">第1关</span></span>
      <span id="scoreInfo">得分:0 MP:0</span>
    </div>
    <div class="t2" id="timerInfo" style="color:#64b4e6">3:00</div>
  </div>
  <div id="panel"><div id="panelContent"></div></div>
  <div id="canvas-wrap"><canvas id="grid"></canvas></div>
  <div id="bottom">
    <div id="selected"></div>
    <div id="itemRow"></div>
    <div id="ctrlRow">
      <button id="btnClear" onclick="game.clear()">清除</button>
    </div>
    <div id="hints"></div>
  </div>
</div>

<div id="profileOverlay" class="overlay"><div class="card">
  <h2>Word Match</h2>

  <div id="profileList" style="margin:8px 0"></div>
  <div style="display:flex;gap:6px;justify-content:center;margin:8px 0">
    <input id="newProfileName" placeholder="输入新名字" style="padding:6px 10px;border:2px solid #e8d5d5;border-radius:12px;font-size:13px;width:140px;text-align:center">
    <button onclick="game.createProfile()" style="font-size:12px;padding:6px 14px">创建</button>
  </div>
  <p id="profileMsg" style="font-size:11px;color:#e86060;min-height:16px"></p>
</div></div>

<div id="menuOverlay" class="overlay hidden"><div class="card">
  <h2>Word Match</h2>
  <p>英语单词消消乐 ~^.^~</p>
  <div id="menuBtns"></div>
  <p style="font-size:11px;color:#c8b8b8;margin-top:12px" id="statsLine"></p>
  <p style="font-size:12px;color:#ffb48c;cursor:pointer" onclick="game.startGame()">点击模式开始</p>
  <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;justify-content:center">
    <button class="secondary" style="padding:5px 10px;font-size:11px" onclick="game.showAchievements()">成就</button>
    <button class="secondary" style="padding:5px 10px;font-size:11px" onclick="game.showLeaderboard('timed')">排行</button>
    <button class="secondary" style="padding:5px 10px;font-size:11px" onclick="game.showCollection()">图鉴</button>
    <button class="secondary" style="padding:5px 10px;font-size:11px" onclick="game.showShop()">商店</button>
    <button class="secondary" style="padding:5px 10px;font-size:11px" onclick="game.dailyCheckIn()">签到</button>
  </div>
</div></div>

<div id="pauseOverlay" class="overlay hidden"><div class="card">
  <h2>| |  暂停中...</h2>
  <p>按 P 继续 | 按 M 回菜单</p>
</div></div>

<div id="gameOverOverlay" class="overlay hidden"><div class="card">
  <div id="gameOverContent"></div>
  <div style="margin:8px 0"><input id="playerName" placeholder="输入名字记入排行榜" style="padding:8px 12px;border:2px solid #e8d5d5;border-radius:12px;font-size:14px;width:80%;text-align:center"></div>
  <button onclick="game.saveScore()">保存成绩</button>
  <button class="secondary" onclick="game.restart()">再来一局</button>
  <button class="secondary" onclick="game.showReview()">单词回顾</button>
  <button class="secondary" onclick="game.backToMenu()">回菜单</button>
</div></div>

<div id="reviewOverlay" class="overlay hidden"><div class="card" style="max-height:80vh;overflow-y:auto">
  <h2>=== 单词回顾 ===</h2>
  <div id="reviewContent"></div>
  <button onclick="game.closeReview()">关闭</button>
</div></div>

<div id="achieveOverlay" class="overlay hidden"><div class="card" style="max-height:80vh;overflow-y:auto">
  <h2>=== 成就 ===</h2>
  <div id="achieveContent"></div>
  <button onclick="game.closeAchieve()">关闭</button>
</div></div>

<div id="leaderboardOverlay" class="overlay hidden"><div class="card" style="max-height:80vh;overflow-y:auto">
  <h2>=== 排行榜 ===</h2>
  <div id="leaderboardTabs" style="margin-bottom:10px"></div>
  <div id="leaderboardContent"></div>
  <button onclick="game.closeLeaderboard()">关闭</button>
</div></div>

<div id="achievePopup" style="position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff;border-radius:16px;padding:12px 20px;box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:100;font-size:14px;font-weight:bold;color:#e8963c;transition:opacity .3s;opacity:0;pointer-events:none"></div>
<div id="itemShopOverlay" class="overlay hidden"><div class="card">
  <h2>=== 道具商店 ===</h2>
  <p style="font-size:12px;color:#c8b8b8">用记忆点数兑换道具</p>
  <div id="shopContent"></div>
  <button onclick="game.closeShop()">关闭</button>
</div></div>

<div id="unlockPopup" class="unlock-pop"></div>

<div id="collectionOverlay" class="overlay hidden"><div class="card" style="max-height:80vh;overflow-y:auto">
  <h2>=== 单词图鉴 ===</h2>
  <div id="collectionContent"></div>
  <button onclick="game.closeCollection()">关闭</button>
</div></div>

class Game {
  constructor() {
    try{
    this.canvas = document.getElementById('grid');
    this.ctx = this.canvas.getContext('2d');
    this.loadState();
    this.resetAll();
    this._initAchievements();
    this.showProfileScreen();
    this.setupEvents();
    this.loop();
    }catch(e){
      document.body.innerHTML='<div style="padding:40px;text-align:center;font-family:sans-serif"><h2>初始化错误</h2><p style="color:red">'+e.message+'</p><pre style="font-size:11px">'+e.stack+'</pre></div>';
      console.error(e);
    }
  }

  loadState() {
    try { this.state = JSON.parse(localStorage.getItem('wm_state')) || {}; } catch(e) { this.state = {}; }

    this.currentPlayer = this.state._lastPlayer || '';

  // 获取单词当前掌握等级 (0-20)
  getWordMastery(word){return this.state.wordMastery[word]||0}
  // 单词升级 (20次=长期记忆, 不同模式奖励不同)
  levelUpWord(word){
    let old=this.getWordMastery(word);
    if(old>=20) return 0;
    let lv=Math.min(20,old+1);
    this.state.wordMastery[word]=lv;
    // 里程碑: Lv5/10/15/20, 按模式给MP
    let pts=0;
    if(lv===5||lv===10||lv===15||lv===20){
      if(this.mode==='timed') pts=(lv===20?4:(lv===10||lv===15?2:1));        // 9MP/词
      else if(this.mode==='practice') pts=(lv===10?2:(lv===20?3:0));         // 5MP/词
      else if(this.mode==='endless') pts=(lv===20?5:(lv===10||lv===15?2:1)); // 10MP/词
    }
    if(pts>0){this.state.memoryPoints+=pts;this.saveState()}
    return pts;
  }
  // 当前模式倍率
  getModeMPRate(){return this.mode==='timed'?'9MP/词':this.mode==='practice'?'5MP/词':'10MP/词'}
  // ====== 道具系统 ======
  initItems(){
    this.ITEM_DEFS={
      hint:{id:'hint',name:'提示卡',desc:'短暂显示目标单词3秒',rarity:'普通',icon:'[?]',mpCost:3},
      shuffle:{id:'shuffle',name:'重排卡',desc:'随机重排矩阵字母',rarity:'普通',icon:'[~]',mpCost:3},
      freeze:{id:'freeze',name:'冻结卡',desc:'暂停计时10秒(限时/无尽)',rarity:'稀有',icon:'[=]',mpCost:6},
      double:{id:'double',name:'双倍卡',desc:'下次匹配得分翻倍',rarity:'稀有',icon:'[x2]',mpCost:6},
      lightning:{id:'lightning',name:'闪电卡',desc:'自动完成当前正在拼的单词',rarity:'史诗',icon:'[!]',mpCost:10},
    };
    this.state.items=this.state.items||{hint:0,shuffle:0,freeze:0,double:0,lightning:0};
    this.state.dailyChecked=this.state.dailyChecked||'';
    this.state.level3StarAward=this.state.level3StarAward||{};
    this.state.comboRewardCount=this.state.comboRewardCount||0;
  }
  useItem(id){
    if(!this.state.items[id]||this.state.items[id]<=0) return false;
    if(this.phase!=='play'||this.flashTimer>0) return false;
    if(id==='hint'){
      let active=this.targetWords.filter(w=>this.wordRemaining[w]>0);
      if(!active.length) return false;
      this.revealWord=active[Math.floor(Math.random()*active.length)];this.revealTimer=3;
    }else if(id==='shuffle'){
      let g=this.g,all=[];
      for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++)all.push(this.matrix[r][c]);
      all.sort(()=>Math.random()-.5);let i=0;
      for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++)this.matrix[r][c]=all[i++];
      this.ensureAllFormable();this.selectedCells=[];this.errorCell=null;
    }else if(id==='freeze'){
      if(this.mode!=='timed'&&this.mode!=='endless') return false;
      this.gameTimer+=10;
    }else if(id==='double'){
      this._doubleNext=true;
    }else if(id==='lightning'){
      let active=this.targetWords.filter(w=>this.wordRemaining[w]>0);
      if(!active.length) return false;
      let w=active[0];
      this.selectedCells=[];
      let used=new Set();
      for(let ch of w.toUpperCase()){
        for(let r=0;r<this.g.rows;r++)for(let c=0;c<this.g.cols;c++){
          if(!used.has(r+','+c)&&this.matrix[r][c]===ch){this.selectedCells.push([r,c]);used.add(r+','+c);break}
        }
      }
      if(this.selectedCells.length===w.length) this.autoCheck();
    }
    this.state.items[id]--;this.saveState();
    this.showMsg('使用 '+this.ITEM_DEFS[id].icon+' '+this.ITEM_DEFS[id].name+'!','#f0b830');
    this.updateUI();
    return true;
  }
  buyItem(id){
    let def=this.ITEM_DEFS[id];
    if(this.state.memoryPoints<def.mpCost) return false;
    this.state.memoryPoints-=def.mpCost;
    this.state.items[id]=(this.state.items[id]||0)+1;
    this.saveState();
    this.showMsg('兑换 '+def.icon+' '+def.name+'! (-'+def.mpCost+'MP)','#f0b830');
    this.updateUI();
    return true;
  }
  dailyCheckIn(){
    let today=new Date().toLocaleDateString();
    if(this.state.dailyChecked===today) return false;
    this.state.dailyChecked=today;
    let pool=['hint','shuffle'];
    let gift=pool[Math.floor(Math.random()*pool.length)];
    this.state.items[gift]=(this.state.items[gift]||0)+1;
    this.saveState();
    this.showMsg('签到奖励! '+this.ITEM_DEFS[gift].icon+' x1','#f0b830');
    this.updateUI();
    return true;
  }
  checkAndAwardItems(){
    // 10连击奖励
    if(this.combo===10&&this.state.comboRewardCount<5){
      this.state.comboRewardCount++;
      let pool=['hint','shuffle','freeze'];
      let gift=pool[Math.floor(Math.random()*pool.length)];
      this.state.items[gift]=(this.state.items[gift]||0)+1;
      this.showMsg('10连击奖励! '+this.ITEM_DEFS[gift].icon+' x1','#f0b830');
    }
    // 首次三星奖励
    if(this.levelStars===3&&!this.state.level3StarAward[this.level]){
      this.state.level3StarAward[this.level]=true;
      let gift=Math.random()<0.5?'double':'freeze';
      this.state.items[gift]=(this.state.items[gift]||0)+1;
      this.showMsg('首次三星! '+this.ITEM_DEFS[gift].icon+' x1','#f0b830');
    }
    this.saveState();
  }
  // 获取可用单词 (已解锁词包中的单词)
  getUnlockedWords(){
    let words=[];
    for(let p of this.WORD_PACKS){
      if(this.state.unlockedPacks[p.id]) words.push(...p.words.split(','));
    }
    return words;
  }
  // 获取某个词包的掌握进度
  getPackProgress(packId){
    let p=this.WORD_PACKS.find(x=>x.id===packId);
    if(!p) return {total:0,mastered:0,partial:0};
    let words=p.words.split(','), mastered=0, partial=0;
    for(let w of words){
      let lv=this.getWordMastery(w);
      if(lv>=20) mastered++;
      else if(lv>=1) partial++;
    }
    return {total:words.length,mastered,partial};
  }
  // 玩家点击解锁词包
  unlockPack(packId){
    let p=this.WORD_PACKS.find(x=>x.id===packId);
    if(!p||this.state.unlockedPacks[packId]) return false;
    // 检查前置
    if(p.parent&&!this.state.unlockedPacks[p.parent]) return false;
    // 检查点数
    if(this.state.memoryPoints<p.cost) return false;
    this.state.memoryPoints-=p.cost;
    this.state.unlockedPacks[packId]=true;
    this.saveState();
    this.popUnlock(p);
    // 刷新图鉴
    if(!document.getElementById('collectionOverlay').classList.contains('hidden')) this.showCollection();
    return true;
  }
  getPackUnlockCost(packId){
    let p=this.WORD_PACKS.find(x=>x.id===packId);
    if(!p) return 999;
    if(this.state.unlockedPacks[packId]) return 0;
    if(p.parent&&!this.state.unlockedPacks[p.parent]) return -1; // 前置未解锁
    return p.cost;
  }
  popUnlock(p){
    let pop=document.getElementById('unlockPopup');
    let cn=WORD_CN[p.words.split(',')[0]]||'';
    pop.innerHTML='<div style="font-size:14px;font-weight:bold;color:#f0b830">词包解锁!</div><div style="font-size:12px;color:#503737">'+p.name+' - '+p.desc+'</div>';
    pop.style.opacity='1';
    setTimeout(()=>{pop.style.opacity='0'},2500);
  }

  checkAchievements(){
    let newly=[];
    for(let a of this.ACHIEVEMENTS){
      if(!this.state.achieve[a.id] && a.check()){
        this.state.achieve[a.id]=true;newly.push(a);
        if(a.id==='fever1') this.state.achieve.fever1=true;
      }
    }
    if(newly.length){this.saveState();newly.forEach(a=>this.popAchieve(a))}
    return newly;
  }
  popAchieve(a){
    let pop=document.getElementById('achievePopup');
    pop.textContent=a.icon+' '+a.name+' 解锁! '+a.desc;
    pop.style.opacity='1';
    setTimeout(()=>{pop.style.opacity='0'},2500);

  resetAll() {
    this.phase = 'menu';
    this.mode = 'timed';
    this.level = 1; this.score = 0; this.combo = 0; this.maxCombo = 0;
    this.gameTimer = 180; this.memorizeTimer = 5;
    this.targetWords = []; this.wordRemaining = {}; this.usedWords = new Set();
    this.allWordsSeen = []; this.matrix = []; this.selectedCells = [];
    this.message = ''; this.messageTimer = 0;
    this.flashCells = []; this.flashTimer = 0;
    this.errorCell = null; this.errorTimer = 0;
    this.revealWord = null; this.revealTimer = 0;
    this.wrongTotal = 0; this.perfectWords = 0;
    this.feverActive = false; this.feverTimer = 0;
    this.goldenCell = null; this.goldenTimer = 0;
    this.dropCells = {}; this.screenShake = 0;
    this.levelStars = 0; this.diffBonus = 0;
    this.hintsLeft = 0;
    this.showMenu();
  }

  getGridConfig() {
    let lv = this.level, r, cs;
    if(lv<=2){r=5;cs=90}else if(lv<=4){r=6;cs=75}else if(lv<=7){r=7;cs=65}else{r=8;cs=58}
    // Scale for mobile
    let maxW = Math.min(window.innerWidth - 24, 400);
    let needW = r*cs + (r-1)*6;
    if(needW > maxW){ cs = Math.floor((maxW - (r-1)*6) / r); }
    let aw = r*cs + (r-1)*6, ah = r*cs + (r-1)*6;
    return {rows:r, cols:r, cellSize:cs, areaW:aw, areaH:ah, gridX:0, gridY:0};
  }

  pickWords() {
    this.initWordPacks();
    let lv = this.level, count;
    if(lv<=2) count=1; else if(lv<=4) count=2; else if(lv<=6) count=3;
    else if(lv<=9) count=4; else count=Math.min(5,lv-4);
    // 只用已解锁词库
    let pool=this.getUnlockedWords();
    if(pool.length===0) pool=[...WORD_POOL.A1]; // 兜底
    let avail = [...new Set(pool)].filter(w => !this.usedWords.has(w));
    if(avail.length < count) { avail = [...new Set(pool)]; this.usedWords.clear(); }
    return avail.sort(()=>Math.random()-.5).slice(0, Math.min(count, avail.length));
  }

  startLevel() {
    this._recorded = false;
    this.g = this.getGridConfig();
    this.targetWords = this.pickWords();
    this.targetWords.forEach(w => this.usedWords.add(w));
    this.allWordsSeen.push(...this.targetWords);
    let n = this.level<=3?3:(this.level<=7?4:5);
    n = Math.max(2, Math.min(7, n + this.diffBonus));
    this.wordRemaining = {};
    this.targetWords.forEach(w => this.wordRemaining[w] = Math.floor(Math.random()*3)+n-1);
    this.selectedCells = [];
    this.buildMatrix();
    this.message = ''; this.messageTimer = 0;
    this.flashCells = []; this.flashTimer = 0;
    this.errorCell = null; this.errorTimer = 0;
    this.revealWord = null; this.revealTimer = 0;
    this.wrongTotal = 0; this.perfectWords = 0;
    this.feverActive = false; this.feverTimer = 0;
    this.goldenCell = null; this.goldenTimer = 0;
    this.dropCells = {}; this.screenShake = 0;
    this.hintsLeft = 1;
    this.memorizeTimer = this.targetWords.length * 5;
    this.initItems();
    this.phase = 'memorize';
    this.updateUI();
  }

  buildMatrix() {
    let g = this.g, letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    this.matrix = [];
    for(let r=0;r<g.rows;r++){this.matrix[r]=[];for(let c=0;c<g.cols;c++)this.matrix[r][c]=letters[Math.floor(Math.random()*26)]}
    this.ensureAllFormable();
  }

  canFormWord(word) {
    let all='';
    for(let r of this.matrix) all+=r.join('');
    let mc={}; for(let ch of all) mc[ch]=(mc[ch]||0)+1;
    let wc={}; for(let ch of word.toUpperCase()) wc[ch]=(wc[ch]||0)+1;
    for(let ch in wc) if((mc[ch]||0)<wc[ch]) return false;
    return true;
  }

  ensureAllFormable() {
    let active = this.targetWords.filter(w=>this.wordRemaining[w]>0);
    if(!active.length) return;
    for(let iter=0;iter<20;iter++){
      let ok=true;
      for(let w of active){
        if(!this.canFormWord(w)){ok=false;this.forcePlace(w)}
      }
      if(ok) return;
    }
  }

  forcePlace(word) {
    let g=this.g, w=word.toUpperCase(), all=[];
    for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++)all.push([r,c]);
    all.sort(()=>Math.random()-.5);
    for(let i=0;i<w.length;i++){let [r,c]=all[i];this.matrix[r][c]=w[i]}
  }

  refillMatrix(positions) {
    let g=this.g, letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    let posSet=new Set(positions.map(p=>p[0]+','+p[1]));
    let cols=new Set(positions.map(p=>p[1]));
    for(let col of cols){
      let surviving=[];
      for(let row=0;row<g.rows;row++) if(!posSet.has(row+','+col)) surviving.push(this.matrix[row][col]);
      let newCount=g.rows-surviving.length;
      let newLetters=[];
      for(let i=0;i<newCount;i++) newLetters.push(letters[Math.floor(Math.random()*26)]);
      let colLetters=[...newLetters,...surviving];
      for(let row=0;row<g.rows;row++){
        if(this.matrix[row][col]!==colLetters[row]){
          this.matrix[row][col]=colLetters[row];
          this.dropCells[row+','+col]=1;
        }
      }
    }
    this.ensureAllFormable();
  }

  cellAt(ex, ey) {
    let g=this.g, cx=this.canvas.width/2-g.areaW/2, cy=this.canvas.height/2-g.areaH/2;
    for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++){
      let x=cx+c*(g.cellSize+6), y=cy+r*(g.cellSize+6);
      if(ex>=x&&ex<=x+g.cellSize&&ey>=y&&ey<=y+g.cellSize) return [r,c];
    }
    return null;
  }

  handleClick(r, c) {
    if(this.phase!=='play'||this.flashTimer>0) return;
    let cell=[r,c], idx=this.selectedCells.findIndex(p=>p[0]===r&&p[1]===c);
    if(idx>=0){this.selectedCells.splice(idx,1);this.errorCell=null;this.errorTimer=0}
    else{
      this.selectedCells.push(cell);
      this.beep(600,0.08);
      let sel=this.selectedCells.map(p=>this.matrix[p[0]][p[1]]).join('');
      let active=this.targetWords.filter(w=>this.wordRemaining[w]>0);
      if(!active.some(w=>w.toUpperCase().startsWith(sel))){
        this.errorCell=cell;this.errorTimer=0.35;this.wrongTotal++;
        if(this.combo>=2) this.showMsg('连击中断!','#f06e6e');
        this.combo=0;this.feverActive=false;this.feverTimer=0;
        this.beep(200,0.15);
      }
    }
    if(this.selectedCells.length) this.autoCheck();
    this.updateUI();
  }

  autoCheck() {
    let sel=this.selectedCells.map(p=>this.matrix[p[0]][p[1]]).join('');
    let active=this.targetWords.filter(w=>this.wordRemaining[w]>0);
    let matched=active.find(w=>w.toUpperCase()===sel);
    if(!matched) return;
    this.combo++;
    if(this.combo>this.maxCombo) this.maxCombo=this.combo;
    let mult;
    if(this.combo>=10) mult=5;else if(this.combo>=7) mult=3.5;else if(this.combo>=5) mult=2.5;
    else if(this.combo>=3) mult=1.8;else if(this.combo>=2) mult=1.3;else mult=1;
    let lenBonus=matched.length*2, base=10+lenBonus, perfectBonus=5;
    let feverMult=this.feverActive?2:1;
    let doubleMult=this._doubleNext?2:1;if(this._doubleNext)this._doubleNext=false;
    let pts=Math.floor((base+perfectBonus)*mult*feverMult*doubleMult);
    this.score+=pts;this.perfectWords++;
    this.state.totalWords=(this.state.totalWords||0)+1;
    // 单词掌握度升级
    let mpGain=this.levelUpWord(matched);
    if(mpGain>0) this.showMsg('记忆点数 +'+mpGain+' ('+matched+' Lv'+this.getWordMastery(matched)+')','#f0b830');
    this.flashCells=[...this.selectedCells];this.flashTimer=0.5;
    if(this.goldenCell&&this.selectedCells.some(p=>p[0]===this.goldenCell[0]&&p[1]===this.goldenCell[1])){
      this.score+=15;this.state.totalGoldens=(this.state.totalGoldens||0)+1;
      this.goldenCell=null;this.goldenTimer=0;this.showMsg('* GOLDEN! +15 *','#e8963c');
    }
    this.selectedCells=[];this.errorCell=null;this.errorTimer=0;
    this.wordRemaining[matched]--;
    this.beep(800,0.12);
    if(this.combo===5){this.feverActive=true;this.feverTimer=12;this.state.achieve.fever1=true;this.showMsg('>> FEVER TIME! 2x! <<','#e8963c')}
    if(this.combo>=7) this.screenShake=0.2;
    let cn=WORD_CN[matched]||'', r=this.wordRemaining[matched];
    let tag=this.feverActive?' [x2]':'', ctag=this.combo>=2?' '+this.combo+'x!':'';
    this.showMsg('+'+pts+' '+matched+'('+cn+') x'+r+tag+ctag,'#78c878');
  }

  clear(){this.selectedCells=[];this.errorCell=null;this.errorTimer=0;this.updateUI()}

  showMsg(t,c){this.message=t;this.msgColor=c;this.messageTimer=2}

  hintReveal(){
    if(this.phase!=='play'||this.hintsLeft<=0) return;
    let active=this.targetWords.filter(w=>this.wordRemaining[w]>0);
    if(active.length){this.revealWord=active[Math.floor(Math.random()*active.length)];this.revealTimer=2;this.hintsLeft--;this.updateUI()}
  }

  hintShuffle(){
    if(this.phase!=='play') return;
    let g=this.g, all=[];
    for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++)all.push(this.matrix[r][c]);
    all.sort(()=>Math.random()-.5);let i=0;
    for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++)this.matrix[r][c]=all[i++];
    this.ensureAllFormable();this.selectedCells=[];this.errorCell=null;
    this.showMsg('矩阵已重排!','#e8963c');this.updateUI();
  }

  onLevelDone() {
    if(this.wrongTotal===0&&this.maxCombo>=5) this.levelStars=3;
    else if(this.wrongTotal<=3&&this.maxCombo>=2) this.levelStars=2;
    else this.levelStars=1;
    if(this.wrongTotal<=2&&this.maxCombo>=5) this.diffBonus=Math.min(3,this.diffBonus+1);
    else if(this.wrongTotal>=8||this.maxCombo<=1) this.diffBonus=Math.max(-1,this.diffBonus-1);
    this.phase='level_done';this.transitionTimer=2;
    this.selectedCells=[];this.combo=0;this.feverActive=false;this.feverTimer=0;
    this.checkAndAwardItems();
    this.beep(1000,0.3);setTimeout(()=>this.beep(1200,0.3),150);
    this.updateUI();
  }

    let html='';
    for(let id in this.ITEM_DEFS){
      let d=this.ITEM_DEFS[id],count=this.state.items[id]||0;
      html+='<button onclick="game.useItem(\''+id+'\')" class="'+(count>0?'':'empty')+'">'+d.icon+' x'+count+'</button>';
    }
    html+='<button onclick="game.showShop()" class="shop">+</button>';
    bar.innerHTML=html;
  }

  showReview(){
    this.phase='review';
    document.getElementById('gameOverOverlay').classList.add('hidden');
    document.getElementById('reviewOverlay').classList.remove('hidden');
    let seen=[...new Set(this.allWordsSeen)];
    document.getElementById('reviewContent').innerHTML=seen.map(w=>{
      let cn=WORD_CN[w]||'',done=this.wordRemaining[w]!==undefined&&this.wordRemaining[w]<=0;
      return `<p style="font-size:12px;color:${done?'#78c878':'#968888'};margin:3px 0">${w} ${cn} ${done?'OK':'--'}</p>`;
    }).join('');
  }

  recordGameOver(name){
    this.state.games++;this.state.total_score+=this.score;
    let wordsDone=Object.values(this.wordRemaining).filter(n=>n<=0).length;
    this.state.words_found=(this.state.words_found||0)+wordsDone;
    if(this.maxCombo>this.state.best_combo) this.state.best_combo=this.maxCombo;
    if(this.level>this.state.highest_level) this.state.highest_level=this.level;
    if(this.score>(this.state.high[this.mode]||0)){
      this.state.high[this.mode]=this.score;this.newHigh=true;
    }else this.newHigh=false;
    if(this.levelStars===3) this.state.totalPerfect=(this.state.totalPerfect||0)+1;
    let lb=this.state.leaderboard[this.mode];
    let entry={name:name||this.currentPlayer||'玩家',score:this.score,level:this.level,combo:this.maxCombo,date:new Date().toLocaleDateString()};
    lb.push(entry);
    lb.sort((a,b)=>b.score-a.score);
    if(lb.length>20) lb.length=20;
    this.saveState();
    this.checkAchievements();
  }
  saveScore(){
    if(this._saved) return;
    let name=document.getElementById('playerName').value.trim()||'玩家';
    this.recordGameOver(name);
    this._saved=true;
    document.getElementById('playerName').style.display='none';
    document.getElementById('gameOverContent').innerHTML+='<p style="color:#78c878;font-size:13px;font-weight:bold">已保存, '+name+'!</p>';
  }
  restart(){
    // 未保存则自动记录
    if(!this._saved) this.recordGameOver('未署名');
    this.level=1;this.score=0;this.combo=0;this.maxCombo=0;
    this.usedWords=new Set();this.allWordsSeen=[];
    this.gameTimer=this.mode==='timed'?180:9999;
    document.getElementById('gameOverOverlay').classList.add('hidden');
    document.getElementById('playerName').style.display='';
    this._saved=false;this._recorded=false;
    this.startLevel();
  }

  // Audio
  beep(freq,dur){
    try{
      let ctx=new(window.AudioContext||window.webkitAudioContext)();
      let o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=freq;g.gain.value=0.15;
      o.connect(g);g.connect(ctx.destination);
      o.start();g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
      o.stop(ctx.currentTime+dur);
    }catch(e){}
  }

  // Update
  update(dt){
    if(this.messageTimer>0) this.messageTimer-=dt;
    if(this.errorTimer>0) this.errorTimer-=dt;
    if(this.revealTimer>0) this.revealTimer-=dt;
    if(this.screenShake>0) this.screenShake-=dt;
    if(this.feverActive){this.feverTimer-=dt;if(this.feverTimer<=0) this.feverActive=false}
    if(this.phase==='play'&&!this.goldenCell&&this.flashTimer<=0){
      if(Math.random()<0.0012){
        let g=this.g;
        this.goldenCell=[Math.floor(Math.random()*g.rows),Math.floor(Math.random()*g.cols)];
        this.goldenTimer=10;this.showMsg('* Golden Letter! +15 *','#e8963c');
      }
    }
    if(this.goldenTimer>0){this.goldenTimer-=dt;if(this.goldenTimer<=0) this.goldenCell=null}
    for(let k in this.dropCells){this.dropCells[k]-=dt*4;if(this.dropCells[k]<=0) delete this.dropCells[k]}
    if(this.flashTimer>0){this.flashTimer-=dt;if(this.flashTimer<=0){
      this.refillMatrix(this.flashCells);this.flashCells=[];
      if(this.selectedCells.length&&this.phase==='play') this.autoCheck();
      if(this.levelCleared()) this.onLevelDone();
    }}
    if(this.phase==='memorize'){this.memorizeTimer-=dt;if(this.memorizeTimer<=0){this.memorizeTimer=0;this.phase='play';this.updateUI()}}
    else if(this.phase==='play'&&this.mode!=='practice'){this.gameTimer-=dt;if(this.gameTimer<=0){this.gameTimer=0;this.phase='game_over';this.combo=0;this.showGameOver()}}
    else if(this.phase==='level_done'){this.transitionTimer-=dt;if(this.transitionTimer<=0){this.level++;this.startLevel()}}
  }

  showGameOver(){
    let ratings={3:'完美通关!',2:'非常出色!',1:'继续加油!'};
    let wordsDone=Object.values(this.wordRemaining).filter(n=>n<=0).length;
    let html=`<h2>=== 游戏结束 ===</h2>
      <div class="big">得分: ${this.score}</div>
      ${this.renderStars(this.levelStars)}
      <p style="color:#78c878;font-weight:bold">${ratings[this.levelStars]}</p>
      ${this.newHigh?'<p style="color:#e8963c;font-weight:bold">** 新纪录! **</p>':''}
      <p>>> 到达第${this.level}关</p>
      <p>>> 完成${wordsDone}个单词</p>
      <p>>> 最大连击: ${this.maxCombo}</p>`;
    document.getElementById('gameOverContent').innerHTML=html;
    document.getElementById('gameOverOverlay').classList.remove('hidden');
    this.updateUI();
  }

  // UI
  updateUI(){
    let lvl=document.getElementById('levelInfo'),scr=document.getElementById('scoreInfo');
    let tim=document.getElementById('timerInfo'),sel=document.getElementById('selected');
    let panel=document.getElementById('panelContent'),hints=document.getElementById('hints');
    let clearBtn=document.getElementById('btnClear'),plTag=document.getElementById('playerTag');
    plTag.textContent=this.currentPlayer?this.currentPlayer+' ':'';
    lvl.textContent='第'+this.level+'关';
    scr.textContent='得分:'+this.score+(this.feverActive?' <<FEVER>>':'')+(this.combo>=2?' x'+this.combo:'')+' | MP:'+this.state.memoryPoints;
    let m=Math.floor(this.gameTimer/60),s=Math.floor(this.gameTimer%60);
    tim.textContent=this.mode==='practice'?'(练习模式)':(m+':'+(s<10?'0':'')+s);
    tim.style.color=this.mode==='practice'?'#78c878':(this.gameTimer<=15?'#eb5a5a':'#64b4e6');
    if(this.phase==='memorize'){
      let ms=Math.max(1,Math.ceil(this.memorizeTimer));
      let parts=this.targetWords.map(w=>w+'('+(WORD_CN[w]||'')+') x'+this.wordRemaining[w]);
      panel.innerHTML='<div class="mem-label">记忆时间! '+ms+'秒</div><div class="words">'+parts.join('  ')+'</div>';
    }else if(this.phase==='level_done'){
      let r={3:'完美通关!',2:'非常出色!',1:'继续加油!'};
      panel.innerHTML='<div>'+this.renderStars(this.levelStars)+'</div><div style="font-size:13px;color:#78c878;font-weight:bold">'+r[this.levelStars]+'</div>';
    }else{
      let cnParts=this.targetWords.map(w=>{let cn=WORD_CN[w]||'';return this.wordRemaining[w]<=0?cn+'(OK)':cn});
      let done=Object.values(this.wordRemaining).filter(n=>n<=0).length;
      panel.innerHTML='<div class="play-label">??? 凭记忆拼出单词 ???</div><div class="cn-hint">'+cnParts.join(' | ')+'</div><div class="progress">已完成 '+done+'/'+this.targetWords.length+' 个单词</div>';
    }
    sel.textContent=this.selectedCells.length?'已选: '+this.selectedCells.map(p=>this.matrix[p[0]][p[1]]).join(''):'点击字母按顺序拼写...';
    clearBtn.style.display=this.phase==='play'?'inline-block':'none';
    hints.textContent=this.phase==='play'?'1-5道具 | R提示 S重排 P暂停 M菜单 Back撤销':'';
    if(this.phase==='play'&&this.hintsLeft>0) hints.textContent=hints.textContent.replace('提示','提示('+this.hintsLeft+')');
    this._drawItemBar();
  }

  drawGrid(){
    let ctx=this.ctx, g=this.g, canvas=this.canvas;
    let maxW=Math.min(window.innerWidth-24,400), maxH=Math.min(window.innerHeight*0.55,500);
    let needW=g.areaW, needH=g.areaH;
    let w=Math.min(needW,maxW), h=Math.min(needH,maxH);
    canvas.width=w+4;canvas.height=h+4;
    let cx=(canvas.width-needW)/2, cy=(canvas.height-needH)/2;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // shake
    if(this.screenShake>0){cx+=Math.sin(this.screenShake*50)*3;cy+=Math.cos(this.screenShake*50)*3}
    for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++){
      let x=cx+c*(g.cellSize+6), y=cy+r*(g.cellSize+6), sz=g.cellSize;
      let cell=[r,c], dropOff=this.dropCells[r+','+c]||0;
      if(dropOff>0) y-=dropOff*sz*1.5;
      // shadow
      ctx.fillStyle='#e8dcd8';ctx.beginPath();ctx.roundRect(x+2,y+3,sz,sz,14);ctx.fill();
      // bg
      let bg='#fffcfc';
      if(this.flashCells.some(p=>p[0]===r&&p[1]===c)&&this.flashTimer>0)
        bg=Math.floor(this.flashTimer*10)%2===0?'#c8fad2':'#ffffb4';
      else if(this.goldenCell&&this.goldenCell[0]===r&&this.goldenCell[1]===c&&this.goldenTimer>0)
        bg=Math.floor(this.goldenTimer*6)%2===0?'#fff078':'#ffffc8';
      else if(this.errorCell&&this.errorCell[0]===r&&this.errorCell[1]===c&&this.errorTimer>0) bg='#ffc8c8';
      else if(this.selectedCells.some(p=>p[0]===r&&p[1]===c)) bg='#fff5b4';
      ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(x,y,sz,sz,14);ctx.fill();
      // border
      ctx.strokeStyle='#ebd9d0';ctx.lineWidth=1;
      ctx.beginPath();ctx.roundRect(x,y,sz,sz,14);ctx.stroke();
      if(this.selectedCells.some(p=>p[0]===r&&p[1]===c)){ctx.strokeStyle='#ffb832';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x,y,sz,sz,14);ctx.stroke()}
      else if(this.errorCell&&this.errorCell[0]===r&&this.errorCell[1]===c&&this.errorTimer>0){ctx.strokeStyle='#ff6464';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x,y,sz,sz,14);ctx.stroke()}
      else if(this.goldenCell&&this.goldenCell[0]===r&&this.goldenCell[1]===c&&this.goldenTimer>0){ctx.strokeStyle='#e8963c';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x,y,sz,sz,14);ctx.stroke()}
      // letter
      ctx.fillStyle='#503737';ctx.font='bold '+(sz>=85?36:sz>=70?28:22)+'px sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(this.matrix[r][c],x+sz/2,y+sz/2);
    }
  }

  // Events
  setupEvents(){
    this.canvas.addEventListener('pointerdown',e=>{
      e.preventDefault();
      let rect=this.canvas.getBoundingClientRect();
      let ex=e.clientX-rect.left, ey=e.clientY-rect.top;
      let cell=this.cellAt(ex,ey);
      if(cell&&this.phase==='play') this.handleClick(cell[0],cell[1]);
    });
    document.addEventListener('keydown',e=>{
      if(this.phase==='play'){
        if(e.key==='Escape'||e.key==='c') this.clear();
        else if(e.key==='Backspace'){if(this.selectedCells.length){this.selectedCells.pop();this.errorCell=null;this.errorTimer=0;if(this.selectedCells.length)this.autoCheck();this.updateUI()}}
        else if(e.key==='p'){this.phase='paused';document.getElementById('pauseOverlay').classList.remove('hidden')}
        else if(e.key==='r') this.hintReveal();
        else if(e.key==='s') this.hintShuffle();
        else if(e.key==='m'){this.backToMenu();this.updateUI()}
        else if(e.key>='1'&&e.key<='5'){let ids=['hint','shuffle','freeze','double','lightning'];this.useItem(ids[parseInt(e.key)-1])}
      }else if(this.phase==='paused'){
        if(e.key==='p'){this.phase='play';document.getElementById('pauseOverlay').classList.add('hidden')}
        else if(e.key==='m'){this.backToMenu();document.getElementById('pauseOverlay').classList.add('hidden')}
      }else if(this.phase==='memorize'){
        if(e.key==='m'){this.backToMenu();this.updateUI()}
      }
      if(this.phase==='game_over'||this.phase==='review'){
        if(e.key===' ') this.restart();
      }
    });
    window.addEventListener('resize',()=>{if(this.g)this.g=this.getGridConfig()});
  }

  loop(){
    let last=performance.now();
    let frame=()=>{
      let now=performance.now(),dt=Math.min((now-last)/1000,0.1);
      last=now;
      if(this.phase!=='paused'&&this.phase!=='menu'&&this.phase!=='game_over'&&this.phase!=='review'){
        this.update(dt);
        if(this.phase!=='game_over'&&this.phase!=='review') this.drawGrid();
        if(this.phase!=='level_done') this.updateUI();
      }
      if(this.phase==='game_over'||this.phase==='review'){/* keep overlay visible */}
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
}

// roundRect polyfill
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='number') r={tl:r,tr:r,br:r,bl:r};
    this.beginPath();this.moveTo(x+r.tl,y);
    this.lineTo(x+w-r.tr,y);this.quadraticCurveTo(x+w,y,x+w,y+r.tr);
    this.lineTo(x+w,y+h-r.br);this.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h);
    this.lineTo(x+r.bl,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r.bl);
    this.lineTo(x,y+r.tl);this.quadraticCurveTo(x,y,x+r.tl,y);
    this.closePath();
  };
}

let game;
try{ game = new Game(); }catch(e){
  document.body.innerHTML='<div style="padding:40px;text-align:center;font-family:sans-serif"><h2>启动失败</h2><p style="color:red">'+e.message+'</p><pre style="font-size:10px">'+e.stack+'</pre></div>';
}
</script>
